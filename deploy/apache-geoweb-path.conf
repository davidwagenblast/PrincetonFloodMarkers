# Option A: serve at https://geoweb.princeton.edu/PFlood/
# Paste inside the existing <VirtualHost *:443> block of
# /etc/httpd/sites-available/geoweb.princeton.edu.conf, then: apachectl configtest && systemctl reload httpd
# (Port 80 already redirects everything to HTTPS, so only the 443 block needs it.)
# Requires in .env: BASE_PATH=/PFlood/  API_PORT=3001  HOST=127.0.0.1  TRUST_PROXY=1

    # --- PFlood (Node app on 127.0.0.1:3001) ---
    RedirectMatch 301 ^/PFlood$ /PFlood/
    ProxyPass        /PFlood/ http://127.0.0.1:3001/PFlood/ retry=0
    ProxyPassReverse /PFlood/ http://127.0.0.1:3001/PFlood/
    <Location /PFlood/>
        # Photos are capped at 8 MB by the app; refuse anything much bigger at the edge
        LimitRequestBody 10485760
    </Location>
    # --- end PFlood ---
