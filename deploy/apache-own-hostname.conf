# Option B: serve at its own hostname, e.g. https://floodmarkers.princeton.edu/
# Needs a DNS CNAME pointing at this server and a TLS certificate (e.g. certbot).
# Install as /etc/httpd/sites-available/floodmarkers.princeton.edu.conf and symlink into sites-enabled/.
# Requires in .env: BASE_PATH=/  API_PORT=3001  HOST=127.0.0.1  TRUST_PROXY=1  (then rebuild)

<VirtualHost *:80>
    ServerName floodmarkers.princeton.edu
    ErrorLog /etc/httpd/logs/floodmarkers.princeton.edu_error.log
    CustomLog /etc/httpd/logs/floodmarkers.princeton.edu_requests.log combined
    Redirect permanent / https://floodmarkers.princeton.edu/
</VirtualHost>
<VirtualHost *:443>
    ServerName floodmarkers.princeton.edu
    SSLEngine ON
    SSLCertificateKeyFile /etc/letsencrypt/live/floodmarkers.princeton.edu/privkey.pem
    SSLCertificateFile /etc/letsencrypt/live/floodmarkers.princeton.edu/fullchain.pem
    ErrorLog /etc/httpd/logs/floodmarkers.princeton.edu_error.log
    CustomLog /etc/httpd/logs/floodmarkers.princeton.edu_requests.log combined

    ProxyPass        / http://127.0.0.1:3001/ retry=0
    ProxyPassReverse / http://127.0.0.1:3001/
    LimitRequestBody 10485760
</VirtualHost>
